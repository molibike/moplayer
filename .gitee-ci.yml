# Gitee CI 配置 - 自动构建 Tauri 应用
# 注意：Gitee 免费版 CI 对 Windows/macOS 构建器支持有限，主要支持 Linux

stages:
  - install
  - build
  - package

variables:
  NODE_VERSION: "20"
  RUST_VERSION: "stable"

# 安装依赖阶段
install-deps:
  stage: install
  image: node:${NODE_VERSION}-slim
  script:
    - apt-get update && apt-get install -y curl wget
    - npm install
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    - source $HOME/.cargo/env
    - rustup target add x86_64-unknown-linux-gnu
    - cargo install tauri-cli
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
      - ~/.cargo/
  artifacts:
    paths:
      - node_modules/

# Linux 构建阶段
build-linux:
  stage: build
  image: ubuntu:22.04
  script:
    # 安装系统依赖
    - apt-get update
    - apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
    - apt-get install -y nodejs npm curl
    - apt-get install -y pkg-config libssl-dev
    
    # 安装 Rust
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    - source $HOME/.cargo/env
    
    # 安装前端依赖（从缓存恢复）
    - npm ci
    
    # 构建 Tauri 应用
    - cargo tauri build
    
    # 列出构建产物
    - ls -la src-tauri/target/release/bundle/
  artifacts:
    name: "MoPlayer-Linux-${CI_COMMIT_SHORT_SHA}"
    paths:
      - src-tauri/target/release/bundle/**/*.deb
      - src-tauri/target/release/bundle/**/*.AppImage
    expire_in: 30 days

# 创建 Release
release:
  stage: package
  image: registry.cn-shenzhen.aliyuncs.com/gitee-cli/gitee-cli:latest
  script:
    - |
      if [ -n "$GITEE_TOKEN" ]; then
        gitee releases create --tag v${CI_COMMIT_SHORT_SHA} --name "MoPlayer Build ${CI_COMMIT_SHORT_SHA}" --description "Automated build from Gitee CI" || true
      fi
  only:
    - main
    - feature/rust-music-server

[package]
name = "moplayer"
version = "0.60.0"
description = "高性能音视频播放器"
authors = ["MoPlayer Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
reqwest = { version = "0.12", features = ["json", "stream", "cookies"] }
urlencoding = "2.1"
axum = "0.8.8"
tower-http = { version = "0.6.8", features = ["cors"] }
futures-util = "0.3.32"
url = "2.5.8"
bytes = "1.11.1"
regex = "1.11.1"
rand = "0.8.5"
base64 = "0.22"
# HEIC/HEIF 硬件加速解码：纯 Rust 实现，支持 SIMD 加速，比 heic2any 快 5-10 倍
heic = "0.7"
# 用于把解码后的 RGB 缓冲编码为 JPEG 返回给前端
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# RAW 相机格式解码（纯 Rust）：支持 CR2/NEF/ARW/DNG/RW2/ORF/RAF 等主流格式
# rawloader: 负责 RAW 文件解析与 Bayer 像素提取
# imagepipe: 在 rawloader 之上做去马赛克 + 白平衡 + 色彩转换 + 伽马校正，输出可显示 sRGB
rawloader = "0.37"
imagepipe = "0.5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]


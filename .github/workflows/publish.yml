name: 'publish'

on:
  push:
    branches:
      - main
      - feature/rust-music-server
      - fix/player-bugs
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon（M 系列），runner 本身即 arm64，brew 装 arm64 的 libheif
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          # macOS Intel x86_64，用 macos-13 x86_64 runner，避免 arm64 runner 交叉编译 libheif 找不到 x86_64 链接库
          - platform: 'macos-13'
            args: '--target x86_64-apple-darwin'
          # Ubuntu 24.04 自带 libheif 1.17+，满足 libheif-rs 2.x 的最低要求（22.04 只有 1.12 会失败）
          - platform: 'ubuntu-24.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # macos-latest runner 为 arm64，需 aarch64 target；macos-13 runner 为 x86_64，需 x86_64 target
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || matrix.platform == 'macos-13' && 'x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          # Tauri 2 在 Ubuntu 24.04 的官方依赖：
          # - libayatana-appindicator3-dev 替代已被弃用的 libappindicator3-dev
          # - libxdo-dev 为 Tauri 2 新增依赖（用于全局快捷键等）
          # - libheif-dev 供 libheif-rs 绑定（24.04 版本已满足 >= 1.17）
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            libheif-dev

      - name: install dependencies (macos only)
        if: matrix.platform == 'macos-latest' || matrix.platform == 'macos-13'
        run: |
          brew install libheif pkg-config

      # Windows: 使用 runner 预装的 vcpkg 安装 libheif（静态链接），并通过 GitHub Actions 缓存二进制包加速
      # 使用 x64-windows-static-md triplet：libheif 及其依赖（libde265、libaom 等）全部静态链接进 exe，
      # 但 C/C++ 运行时仍使用动态 CRT（与 Tauri/WebView2 兼容），最终用户无需任何额外 DLL
      - name: setup vcpkg cache (windows only)
        if: matrix.platform == 'windows-latest'
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-libheif-static-${{ runner.os }}-v2

      - name: install dependencies (windows only)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          # windows-latest runner 预装了 vcpkg 在 C:\vcpkg
          # 使用 x64-windows-static-md：静态链接 libheif + 依赖，动态 CRT
          C:\vcpkg\vcpkg.exe install libheif:x64-windows-static-md
          # 告诉 libheif-sys 的 vcpkg crate 使用 static-md triplet 查找库
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
          echo "VCPKGRS_TRIPLET=x64-windows-static-md" >> $env:GITHUB_ENV

      - name: install frontend dependencies
        run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: moplayer-v__VERSION__
          releaseName: 'MoPlayer v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

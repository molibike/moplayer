name: 'publish'

on:
  push:
    branches:
      - main
      - feature/rust-music-server
      - fix/player-bugs
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libheif-dev

      - name: install dependencies (macos only)
        if: matrix.platform == 'macos-latest'
        run: |
          brew install libheif pkg-config

      # Windows: 使用 runner 预装的 vcpkg 安装 libheif，并通过 GitHub Actions 缓存二进制包避免每次重新编译
      - name: setup vcpkg cache (windows only)
        if: matrix.platform == 'windows-latest'
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-libheif-${{ runner.os }}-v1

      - name: install dependencies (windows only)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          # windows-latest runner 预装了 vcpkg 在 C:\vcpkg
          C:\vcpkg\vcpkg.exe install libheif:x64-windows
          # 将 libheif 所在目录写入环境变量，供 libheif-sys 通过 vcpkg 查找
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
          echo "VCPKGRS_DYNAMIC=1" >> $env:GITHUB_ENV
          # 把 libheif DLL 目录加入 PATH，运行时链接需要
          echo "C:\vcpkg\installed\x64-windows\bin" >> $env:GITHUB_PATH

      - name: install frontend dependencies
        run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: moplayer-v__VERSION__
          releaseName: 'MoPlayer v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
